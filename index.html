<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turtlis</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-4">
  <!-- メインレイアウト -->
  <div class="flex flex-col lg:flex-row gap-8 items-start justify-center max-w-7xl w-full">

    <!-- 左側: ゲーム表示領域 -->
    <div class="flex flex-col items-center mx-auto lg:mx-0">
      <div class="relative">
        <canvas id="gameCanvas" width="540" height="620"></canvas>
        <div id="aiStatusOverlay" class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-md rounded-lg p-2 text-xs text-slate-200 border border-indigo-500/50 shadow-lg hidden">
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-indigo-400 animate-pulse"></span>
            <span id="aiStatusText" class="font-bold">AI OFF</span>
          </div>
          <div id="aiStatusDetail" class="text-slate-400 mt-1"></div>
        </div>
      </div>
    </div>

    <!-- 右側: 詳細なハンドリング設定パネル -->
    <div class="w-full lg:w-[560px] bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl max-h-[85vh] overflow-y-auto backdrop-blur-md">
      <h2 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 mb-5 pb-3 border-b border-slate-800 flex items-center gap-2">
        <svg class="text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 24px; height: 24px; min-width: 24px; min-height: 24px; display: inline-block;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
        ハンドリングチューニング
      </h2>

      <div class="mb-4 text-xs text-slate-400 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
        <div class="font-bold text-slate-200 text-sm mb-1">🕹️ 基本操作</div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <ul class="list-disc list-inside space-y-0.5">
              <li>[A / D]: 左右移動</li>
              <li>[W]: <span class="text-amber-400 font-semibold">ソフトドロップ</span></li>
              <li>[S]: <span class="text-cyan-400 font-semibold">ハードドロップ</span></li>
            </ul>
          </div>
          <div>
            <ul class="list-disc list-inside space-y-0.5">
              <li>[← / →]: 左右回転</li>
              <li>[↑]: <span class="text-indigo-400">180度回転</span></li>
              <li>[Shift / C]: <span class="text-emerald-400 font-semibold">ホールド</span></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="space-y-6 text-sm">

        <!-- ARR -->
        <div class="bg-slate-950/40 p-3.5 rounded-lg border border-slate-800/60">
          <div class="flex justify-between mb-1">
            <label class="font-bold text-slate-200">ARR (Auto Repeat Rate)</label>
            <span id="arrVal" class="text-cyan-400 font-mono text-xs">0.0F (ワープ)</span>
          </div>
          <input type="range" id="cfgARR" min="0" max="10" step="0.1" value="0" class="w-full accent-cyan-500 bg-slate-800 h-1 rounded-lg">
        </div>

        <!-- DAS -->
        <div class="bg-slate-950/40 p-3.5 rounded-lg border border-slate-800/60">
          <div class="flex justify-between mb-1">
            <label class="font-bold text-slate-200">DAS (Delayed Auto Shift)</label>
            <span id="dasVal" class="text-cyan-400 font-mono text-xs">5.7F (95ms)</span>
          </div>
          <input type="range" id="cfgDAS" min="1" max="25" step="0.1" value="5.7" class="w-full accent-cyan-500 bg-slate-800 h-1 rounded-lg">
        </div>

        <!-- DCD -->
        <div class="bg-slate-950/40 p-3.5 rounded-lg border border-slate-800/60">
          <div class="flex justify-between mb-1">
            <label class="font-bold text-slate-200">DCD (DAS Cut Delay)</label>
            <span id="dcdVal" class="text-cyan-400 font-mono text-xs">0.0F (なし)</span>
          </div>
          <input type="range" id="cfgDCD" min="0" max="20" step="0.1" value="0" class="w-full accent-cyan-500 bg-slate-800 h-1 rounded-lg">
        </div>

        <!-- SDF -->
        <div class="bg-slate-950/40 p-3.5 rounded-lg border border-slate-800/60">
          <div class="flex justify-between mb-1">
            <label class="font-semibold text-slate-200">SDF (Soft Drop Factor)</label>
            <span id="sdfVal" class="text-cyan-400 font-mono text-xs">INF (無限)</span>
          </div>
          <input type="range" id="cfgSDF" min="5" max="41" step="1" value="41" class="w-full accent-cyan-500 bg-slate-800 h-1 rounded-lg">
        </div>

        <hr class="border-slate-800">

        <div class="space-y-4">
          <label class="flex items-start gap-3 cursor-pointer p-1">
            <input type="checkbox" id="cfgPreventAccident" checked class="mt-1 accent-cyan-500 rounded bg-slate-800 border-slate-700">
            <div>
              <span class="font-bold text-slate-200 block">偶発的ハードドロップの防止</span>
            </div>
          </label>

          <label class="flex items-start gap-3 cursor-pointer p-1">
            <input type="checkbox" id="cfgCancelDasOnDir" class="mt-1 accent-cyan-500 rounded bg-slate-800 border-slate-700">
            <div>
              <span class="font-bold text-slate-200 block">方向転換時にDASをキャンセル</span>
            </div>
          </label>

          <label class="flex items-start gap-3 cursor-pointer p-1">
            <input type="checkbox" id="cfgPreferMovement" checked class="mt-1 accent-cyan-500 rounded bg-slate-800 border-slate-700">
            <div>
              <span class="font-bold text-slate-200 block">ソフトドロップより左右移動を優先</span>
            </div>
          </label>
        </div>

        <hr class="border-slate-800">

        <div>
          <label class="font-bold text-slate-200 block mb-1">回転ルール (Kick Table)</label>
          <select id="cfgKickTable" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="SRS">SRS (180度回転は簡易仕様)</option>
            <option value="SRS+" selected>SRS+ (T・Iミノの180度回転拡張)</option>
          </select>
        </div>

        <div>
          <label class="font-bold text-slate-200 block mb-1">IRS (先行回転バッファ)</label>
          <select id="cfgIRS" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="OFF">OFF</option>
            <option value="HOLD">HOLD</option>
            <option value="TAP" selected>TAP</option>
          </select>
        </div>

        <div>
          <label class="font-bold text-slate-200 block mb-1">IHS (先行ホールドバッファ)</label>
          <select id="cfgIHS" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500">
            <option value="OFF">OFF</option>
            <option value="HOLD">HOLD</option>
            <option value="TAP" selected>TAP</option>
          </select>
        </div>

      </div>
      <div class="mt-6 bg-slate-950/40 p-4 rounded-lg border border-slate-800/60">
        <div class="flex items-center justify-between">
          <label for="aiToggle" class="font-bold text-slate-200">AI Suggest</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="aiToggle" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-500 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            <span class="ml-3 text-sm font-medium text-slate-300">ON/OFF</span>
          </label>
        </div>
        <div class="flex items-center justify-between mt-3">
          <label for="aiAutoToggle" class="font-bold text-slate-200">AI Auto</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="aiAutoToggle" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-500 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            <span class="ml-3 text-sm font-medium text-slate-300">ON/OFF</span>
          </label>
        </div>
        <pre id="aiOutput" class="mt-3 text-xs text-slate-300 whitespace-pre-wrap"></pre>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
